<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
  <defs>
    <!-- Deep Sapphire-Glacier Optical Prism Backdrop -->
    <linearGradient id="bg" x1="0.10" y1="0.04" x2="0.90" y2="0.96">
      <stop offset="0%" stop-color="#6fa8ff"/>
      <stop offset="42%" stop-color="#376ef0"/>
      <stop offset="78%" stop-color="#2146b8"/>
      <stop offset="100%" stop-color="#11225e"/>
    </linearGradient>
    <radialGradient id="causticTop" cx="0.22" cy="0.14" r="0.68">
      <stop offset="0%" stop-color="#e4f4ff" stop-opacity="0.82"/>
      <stop offset="40%" stop-color="#98cbff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#98cbff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="causticViolet" cx="0.86" cy="0.22" r="0.56">
      <stop offset="0%" stop-color="#b49aff" stop-opacity="0.46"/>
      <stop offset="55%" stop-color="#6d6cff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6d6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="causticTeal" cx="0.18" cy="0.88" r="0.58">
      <stop offset="0%" stop-color="#56e0d8" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#2d9de0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2d9de0" stop-opacity="0"/>
    </radialGradient>

    <!-- Liquid Glass Specular Surfaces -->
    <linearGradient id="glassBody" x1="0.18" y1="0.06" x2="0.84" y2="0.96">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.66"/>
      <stop offset="36%" stop-color="#eef5ff" stop-opacity="0.34"/>
      <stop offset="72%" stop-color="#d6e6ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.44"/>
    </linearGradient>
    <linearGradient id="glassRim" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="45%" stop-color="#d8ecff" stop-opacity="0.52"/>
      <stop offset="78%" stop-color="#8ab8ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="roofCrystal" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="48%" stop-color="#dcecff" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#a8c9ff" stop-opacity="0.56"/>
    </linearGradient>
    <linearGradient id="alcoveGlass" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0b1d52" stop-opacity="0.46"/>
      <stop offset="55%" stop-color="#17347a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#60a8ff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="drawerGlass" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.58"/>
      <stop offset="50%" stop-color="#e5f0ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c6ddff" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="pillHandle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#cde2ff" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="topGlint" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Jewel-Glass Shelf Objects -->
    <linearGradient id="gemTeal" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#a8fff2"/>
      <stop offset="100%" stop-color="#2bb8b0"/>
    </linearGradient>
    <linearGradient id="gemGold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#fff0c8"/>
      <stop offset="100%" stop-color="#e0a958"/>
    </linearGradient>
    <linearGradient id="gemViolet" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#e8d8ff"/>
      <stop offset="100%" stop-color="#8b74f0"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="0.5" cy="0.12" r="0.76">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#a6d4ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a6d4ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="bodyShadow" x="-22%" y="-20%" width="144%" height="152%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#071338" flood-opacity="0.40"/>
    </filter>
    <filter id="roofShadow" x="-22%" y="-22%" width="144%" height="154%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0a1a4a" flood-opacity="0.32"/>
    </filter>
    <filter id="pillShadow" x="-35%" y="-40%" width="170%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b1f54" flood-opacity="0.30"/>
    </filter>

    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="alcoveClip"><rect x="342" y="408" width="340" height="146" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- Luminous optical backdrop -->
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#causticTop)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#causticViolet)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#causticTeal)"/>

    <!-- Subtle curved optical meniscus sheen at top of tile -->
    <ellipse cx="512" cy="112" rx="460" ry="180" fill="url(#topGlint)"/>

    <!-- Ambient ground reflection under floating glass vault -->
    <ellipse cx="512" cy="792" rx="224" ry="26" fill="#071338" opacity="0.32" filter="url(#softBlur)"/>

    <!-- Sculpted Liquid Glass Vault House Body -->
    <g filter="url(#bodyShadow)">
      <path d="M512 264 L736 410 V704 C736 736 710 762 678 762 H346 C314 762 288 736 288 704 V410 Z"
            fill="url(#glassBody)" stroke="url(#glassRim)" stroke-width="5"/>
    </g>

    <!-- Diagonal liquid glass surface specular sweep -->
    <path d="M512 272 L670 375 L340 610 V414 Z" fill="#ffffff" opacity="0.11"/>

    <!-- Minimal luminous oculus window -->
    <circle cx="512" cy="346" r="21" fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.72" stroke-width="3.5"/>
    <circle cx="512" cy="346" r="9" fill="#ffffff" fill-opacity="0.82"/>

    <!-- Upper crystal display chamber -->
    <g clip-path="url(#alcoveClip)">
      <rect x="342" y="408" width="340" height="146" rx="28" fill="url(#alcoveGlass)"/>
      <rect x="342" y="408" width="340" height="146" rx="28" fill="url(#innerGlow)"/>
      <!-- Luminous frosted crystal items on shelf -->
      <rect x="380" y="472" width="66" height="82" rx="18" fill="url(#gemTeal)" fill-opacity="0.90"/>
      <rect x="389" y="481" width="48" height="10" rx="5" fill="#ffffff" opacity="0.58"/>
      <circle cx="486" cy="512" r="36" fill="url(#gemGold)" fill-opacity="0.92"/>
      <ellipse cx="476" cy="498" rx="12" ry="7" transform="rotate(-24 476 498)" fill="#ffffff" opacity="0.65"/>
      <rect x="544" y="454" width="44" height="100" rx="12" fill="url(#gemViolet)" fill-opacity="0.92"/>
      <rect x="552" y="466" width="28" height="7" rx="3.5" fill="#ffffff" opacity="0.62"/>
      <rect x="598" y="478" width="44" height="76" rx="12" fill="#ffffff" fill-opacity="0.74"/>
      <rect x="606" y="490" width="28" height="6" rx="3" fill="#5e95ff" opacity="0.45"/>
    </g>
    <!-- Crisp recessed glass border on chamber -->
    <rect x="342" y="408" width="340" height="146" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.46" stroke-width="3"/>

    <!-- Lower sculpted liquid glass drawer module -->
    <rect x="342" y="578" width="340" height="134" rx="30" fill="url(#drawerGlass)" stroke="url(#glassRim)" stroke-width="3.5"/>
    <rect x="358" y="584" width="308" height="6" rx="3" fill="#ffffff" opacity="0.55"/>

    <!-- Floating crystal capsule drawer pull -->
    <g filter="url(#pillShadow)">
      <rect x="444" y="633" width="136" height="26" rx="13" fill="url(#pillHandle)"/>
    </g>
    <rect x="456" y="638" width="112" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>

    <!-- Sculpted Liquid Crystal Pitched Roof Arch -->
    <g filter="url(#roofShadow)">
      <path d="M236 426 L496 238 C506 231 518 231 528 238 L788 426"
            fill="none" stroke="url(#roofCrystal)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M244 412 L499 228 C507 222 517 222 525 228 L780 412"
            fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Prismatic inner crystal edge -->
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="url(#glassRim)" stroke-width="4.5"/>
</svg>
