<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>物品库</title>
<meta name="description" content="个人生活、实体本子与常备装备的离线优先物品库。">
<meta name="theme-color" content="#f2f5fb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="物品库">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
(function(){try{var t=localStorage.getItem('itemvault-theme');if(t==='light'||t==='system'||t==='dark'){document.documentElement.dataset.theme=t;var dark=t==='dark'||(t==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(dark){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#0b0f19');}}}catch(e){}})();
</script>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app"><p style="padding:24px;color:#66738c;">正在加载物品库…</p></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;">物品库需要启用 JavaScript。</p></noscript>
</body>
</html>
